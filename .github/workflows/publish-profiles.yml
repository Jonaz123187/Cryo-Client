name: Publish Nivo profile service
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["deployment/profile-service/**", ".github/workflows/publish-profiles.yml"]
permissions:
  contents: read
concurrency:
  group: nivo-production-profiles
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Validate worker syntax
        run: node --check deployment/profile-service/worker.mjs
      - name: Deploy worker while preserving existing service configuration
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          command: deploy --config deployment/profile-service/wrangler.jsonc --keep-vars
      - name: Verify production revision
        run: |
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('https://nivo-api.jonasneubauer94.workers.dev/health', timeout=30) as response:
              data=json.load(response)
          assert data.get('revision')=='public-profiles-3', data
          assert data.get('registration')=='minecraft-verified', data
          assert data.get('verifier')=='supabase', data
          print('Public profile service is healthy; Minecraft proof remains required.')
          PY
